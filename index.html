<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NB's Schedule</title>
<style>

  @property --active-accent {
    syntax: "<color>";
    inherits: true;
    initial-value: #c8d0df; 
  }

  @property --header-color {
    syntax: "<color>";
    inherits: true;
    initial-value: #fdfdff;
  }

  :root {
    color-scheme: light;
    --ink: #172033;
    --muted: #6b7285;
    --hairline: rgba(37, 54, 91, 0.11);
    --current: #28a745;
    --shadow: 0 22px 60px rgba(37, 53, 91, 0.16);
  }

  * { box-sizing: border-box; }

  html {
    min-height: 100%;
    background: #ffffff; 
    overscroll-behavior-y: none;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: #ffffff;
    background-attachment: fixed;
    transition: background 300ms ease, --active-accent 600ms ease;
  }

  button { font: inherit; }

  .app-shell {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 18px 10px 97px;
  }

  .phone {
    position: relative; 
    --active-accent: #5b8fd6;
    width: min(100%, 430px);
    border: none;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.74);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.58)),
      rgba(255, 255, 255, 0.62);
    padding: 20px 14px 16px;
    backdrop-filter: blur(22px);
    transition: --active-accent 600ms ease;
  }

  .header {
    --header-color: #fdfdff;
    position: sticky;
    top: 0; 
    z-index: 30;
    padding: 20px 14px 12px;
    margin: -20px -14px 0; 
    background: linear-gradient(
      to bottom,
      var(--header-color) 0%,
      var(--header-color) 25%,
      rgba(255, 255, 255, 0) 100%
    );
    transition: box-shadow 220ms ease, --header-color 600ms ease, padding 220ms ease;
  }

  .header::after {
    display: none;
  }

  .header .eyebrow {
    overflow: hidden;
    max-height: 20px;
    margin: 0 0 8px;
    transition: max-height 220ms ease, opacity 220ms ease, margin 220ms ease;
  }

  .header.compact .eyebrow {
    max-height: 0;
    margin: 0;
    opacity: 0;
  }

  .eyebrow {
    color: #7d88a2;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  .title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .title-block { min-width: 0; }

  h1 {
    margin: 0;
    font-size: 32px;
    line-height: 1.1;
    letter-spacing: 0;
    font-weight: 720;
    transition: font-size 220ms ease;
  }

  .header.compact h1 {
    font-size: 26px;
  }

  .subtitle {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
  }

  .header.compact .subtitle {
    font-size: 12.5px;
  }

  .live-clock {
    flex-shrink: 0;
    min-width: 62px;
    border: 1px solid rgba(255, 255, 255, 0.75);
    border-radius: 14px;
    padding: 6px 10px 5px;
    text-align: center;
    background: #ffffff;
  }

  .header.compact .live-clock {
    border-radius: 12px;
    padding: 5px 9px 4px;
  }

  .live-clock span {
    display: block;
    font-size: 14px;
    line-height: 1;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .live-clock small {
    display: block;
    margin-top: 3px;
    color: #7b8498;
    font-size: 7.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* Day progress bar */
  .day-progress {
    position: fixed;
    left: 50%;
    bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 20px));
    transform: translateX(-50%);
    z-index: 40;
    width: min(calc(100% - 58px), 392px);
    border: 1px solid rgba(255, 255, 255, 0.85);
    border-radius: 18px;
    padding: 10px 14px 12px;
    background: #fbfcff;
    box-shadow: 0 12px 28px rgba(45, 64, 110, 0.18);
    overflow: hidden;
  }

  .day-progress.hidden {
    display: none;
  }

  .day-progress-label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  .day-progress-label .task-name {
    min-width: 0;
    color: #263252;
    font-size: 12.5px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .day-progress-label .percent {
    flex-shrink: 0;
    color: #8790a3;
    font-size: 12px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  .day-progress-track {
    position: relative;
    display: flex;
    width: 100%;
    height: 7px;
    gap: 2px;
    border-radius: 999px;
    overflow: hidden;
  }

  .day-progress-segment {
    position: relative;
    height: 100%;
    min-width: 2px;
    border-radius: 2px;
    overflow: hidden;
    background: color-mix(in srgb, var(--seg-color) 24%, white);
  }

  .day-progress-segment:first-child { border-top-left-radius: 999px; border-bottom-left-radius: 999px; }
  .day-progress-segment:last-child { border-top-right-radius: 999px; border-bottom-right-radius: 999px; }

  .day-progress-segment-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    background: var(--seg-color);
    transition: width 900ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Day tabs */
  .day-tabs {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-top: 16px;
  }

  .day-tab {
    position: relative;
    z-index: 2;
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.68);
    border-radius: 13px;
    padding: 8px 2px 7px;
    background: #ffffff;
    color: #596178;
    font-size: 11.5px;
    font-weight: 650;
    text-align: center;
    cursor: pointer;
    transition: background 180ms ease, color 180ms ease, border-color 180ms ease, box-shadow 180ms ease, transform 140ms ease;
  }

  .day-tab:active { transform: scale(0.96); }

  .day-tab.selected {
    background: var(--active-accent, #5b8fd6);
    color: #ffffff;
    border-color: transparent;
    box-shadow: 0 6px 14px color-mix(in srgb, var(--active-accent, #5b8fd6) 40%, transparent);
  }

  .day-tab.is-today:not(.selected) {
    border-color: var(--current);
    color: #218838;
  }

  .schedule {
    display: grid;
    gap: 14px;
    padding: 18px 5px 24px;
    position: relative;
  }

  @keyframes currentTaskFloat {
    0%, 100% {
      box-shadow:
        0 0 0 3px color-mix(in srgb, var(--card-accent) 18%, transparent),
        0 0 12px 1px color-mix(in srgb, var(--card-accent) 25%, transparent),
        0 20px 44px rgba(42, 62, 104, 0.16);
    }
    50% {
      box-shadow:
        0 0 0 6px color-mix(in srgb, var(--card-accent) 24%, transparent),
        0 0 24px 4px color-mix(in srgb, var(--card-accent) 34%, transparent),
        0 28px 58px rgba(42, 62, 104, 0.22);
    }
  }

  .card {
    --card-accent: #5b8fd6;
    --card-next: #4fb0b5;
    --card-border: rgba(80, 124, 187, 0.22);
    position: relative;
    z-index: 1;
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 12px 14px 13px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.56), rgba(255, 255, 255, 0.22)),
      linear-gradient(
        135deg,
        color-mix(in srgb, var(--card-accent) 25%, white),
        color-mix(in srgb, var(--card-next) 30%, white)
      );
    box-shadow: 0 12px 30px rgba(42, 62, 104, 0.12);
    overflow: visible;
    transform: translateY(0);
    transform-origin: center;
    opacity: 1;
    transition:
      filter 620ms cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow 720ms cubic-bezier(0.22, 1, 0.36, 1),
      border-color 620ms cubic-bezier(0.22, 1, 0.36, 1),
      background 720ms cubic-bezier(0.22, 1, 0.36, 1),
      transform 640ms cubic-bezier(0.18, 1.35, 0.32, 1);
    transition-delay: var(--card-in-delay, 0ms);
  }

  .card.card-enter {
    opacity: 0;
    transform: translateY(105px);
  }

  .card.current {
    background: #ffffff;
    border: 1.5px solid color-mix(in srgb, var(--card-accent) 55%, white);
    opacity: 1;
    z-index: 5;
    transform: translateY(-2px) scale(1.01);
    animation: currentTaskFloat 3.4s cubic-bezier(0.45, 0, 0.2, 1) infinite;
  }

  .card.current .day-label,
  .card.current .time,
  .card.current .duration {
    color: color-mix(in srgb, var(--card-accent) 65%, #1b2947);
  }

  .card.current .icon {
    color: color-mix(in srgb, var(--card-accent) 72%, #1b2947);
  }

  .card.past {
    box-shadow: 0 8px 18px rgba(42, 62, 104, 0.08);
    transform: translateY(0) scale(0.995);
  }

  .card.previous-day {
    filter: grayscale(0.85) saturate(0.3);
    opacity: 1; 
    box-shadow: 0 8px 18px rgba(42, 62, 104, 0.08);
    transform: translateY(0) scale(0.995);
  }

  .now-badge {
    position: absolute;
    top: -9px;
    right: 14px;
    border-radius: 999px;
    padding: 3px 10px;
    background: var(--card-accent);
    color: #ffffff;
    box-shadow: 0 6px 14px color-mix(in srgb, var(--card-accent) 55%, transparent);
    font-size: 9px;
    font-weight: 850;
    letter-spacing: 0.06em;
    line-height: 1;
    text-transform: uppercase;
  }

  .card-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    column-gap: 8px;
  }

  .day-label {
    justify-self: start;
    color: color-mix(in srgb, var(--card-accent) 65%, #223056);
    font-size: 11.5px;
    font-weight: 700;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .time {
    justify-self: center;
    color: #314368;
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: 0;
    font-variant-numeric: tabular-nums;
    text-align: center;
    white-space: nowrap;
  }

  .duration {
    justify-self: end;
    color: #6f7890;
    font-size: 11px;
    font-weight: 650;
    line-height: 1.1;
    text-align: right;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .divider {
    height: 1px;
    margin: 10px 0 11px;
    background: linear-gradient(90deg, transparent, rgba(34, 52, 90, 0.2), transparent);
  }

  .activity {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 38px;
    padding: 2px 2px 0;
  }

  .activity + .activity {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed rgba(34, 52, 90, 0.15);
  }

  .icon {
    position: absolute;
    left: 2px;
    top: 50%;
    transform: translateY(-50%);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    color: color-mix(in srgb, var(--card-accent) 78%, #24324f);
    background: rgba(255, 255, 255, 0.6);
  }

  .icon svg {
    width: 21px;
    height: 21px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .activity-title {
    min-width: 0;
    max-width: calc(100% - 100px);
    color: #202a3f;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    text-align: center;
    overflow-wrap: anywhere;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    padding: 30px 10px;
  }
</style>
</head>
<body>
  <main class="app-shell" aria-label="Weekly schedule">
    <section class="phone">
      <header class="header" id="header">
        <p class="eyebrow">Week at a Glance</p>
        <div class="title-row">
          <div class="title-block">
            <h1>NB's Schedule</h1>
            <p class="subtitle" id="todayLabel">Loading today</p>
          </div>
          <div class="live-clock" aria-label="Current time">
            <span id="liveTime">--:--</span>
            <small>Live</small>
          </div>
        </div>
        <nav class="day-tabs" id="dayTabs" aria-label="Select day"></nav>
      </header>

      <section class="schedule" id="schedule" aria-live="polite"></section>
    </section>
  </main>

  <div class="day-progress hidden" id="dayProgress" aria-label="Day progress">
    <div class="day-progress-label">
      <span class="task-name" id="dayProgressTask">&mdash;</span>
      <span class="percent" id="dayProgressText">0%</span>
    </div>
    <div class="day-progress-track" id="dayProgressTrack"></div>
  </div>

  <script>
    const ICONS = {
      clock: '<circle cx="12" cy="12" r="4.5"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>',
      workout: '<rect x="1" y="9" width="4" height="6" rx="1"/><rect x="19" y="9" width="4" height="6" rx="1"/><rect x="5.3" y="10.3" width="3.2" height="3.4" rx="0.6"/><rect x="15.5" y="10.3" width="3.2" height="3.4" rx="0.6"/><path d="M8.5 12h7"/>',
      laptop: '<rect x="4" y="4.5" width="16" height="10" rx="1.4"/><path d="M2 18h20"/><path d="M9.5 18l1-3.5h3l1 3.5"/>',
      shower: '<path d="M12 3c3.5 4.5 6 8 6 11a6 6 0 1 1-12 0c0-3 2.5-6.5 6-11Z"/>',
      breakfast: '<path d="M4 8h11v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8Z"/><path d="M15 10h1.6a2 2 0 0 1 0 4H15"/><path d="M7 3.4c0 .9-1 .9-1 1.8M11 3.4c0 .9-1 .9-1 1.8"/>',
      car: '<path d="M5 11L6.4 6.6A2 2 0 0 1 8.3 5h7.4a2 2 0 0 1 1.9 1.6L19 11"/><rect x="2.5" y="11" width="19" height="6" rx="2"/><circle cx="7" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/>',
      briefcase: '<rect x="3" y="7" width="18" height="12" rx="2"/><path d="M8.5 7V5.5A1.5 1.5 0 0 1 10 4h4a1.5 1.5 0 0 1 1.5 1.5V7"/><path d="M3 12.5h18"/>',
      rest: '<path d="M5 13v-3a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/><rect x="3" y="13" width="18" height="5" rx="1.5"/><path d="M5 18v2M19 18v2"/>',
      sparkle: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="M19 3.5l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6.6-1.6Z"/>',
      dinner: '<path d="M6 2v7a2 2 0 0 0 4 0V2"/><path d="M8 9v13"/><path d="M17 2c-1.6 1.1-2.6 3.2-2.6 5.6 0 2 1 3.7 2.6 4.4v10"/>',
      clipboard: '<rect x="5" y="4" width="14" height="18" rx="2"/><rect x="8.5" y="2" width="7" height="4" rx="1"/><path d="M9 13l2 2 4-4"/>',
      moon: '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 3c-.4 1-.6 2-.6 3a7.1 7.1 0 0 0 7.1 7.1c1 0 2-.2 3-.6Z"/><path d="M17 2.5l.5 1.3 1.3.5-1.3.5-.5 1.3-.5-1.3-1.3-.5 1.3-.5.5-1.3Z"/>',
      bed: '<path d="M3 18v-5.5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2V18"/><path d="M3 14.5h18"/><rect x="5" y="9" width="6.5" height="4" rx="1.2"/><path d="M3 18v2M21 18v2"/>'
    };

    const schedule = [
      { time: "06:00 - 06:10", start: 360, end: 370, duration: "10 min",
        entries: [{ icon: "clock", days: "Daily", title: "Wake Up, Hydrate, Freshen Up", essential: true }] },
      { time: "06:10 - 06:55", start: 370, end: 415, duration: "45 min",
        entries: [
          { icon: "workout", days: "MWF", title: "Workout" },
          { icon: "laptop", days: "TT", title: "Second Job" }
        ] },
      { time: "06:55 - 07:10", start: 415, end: 430, duration: "15 min",
        entries: [
          { icon: "shower", days: "MWF", title: "Cool Down And Shower" },
          { icon: "laptop", days: "TT", title: "Continue Second Job" }
        ] },
      { time: "07:10 - 08:00", start: 430, end: 480, duration: "50 min",
        entries: [
          { icon: "breakfast", days: "MWF", title: "Breakfast, Get Ready, Pack Up" },
          { icon: "shower", days: "TT", title: "Shower, Breakfast, Get Ready" }
        ] },
      { time: "08:00 - 08:50", start: 480, end: 530, duration: "50 min",
        entries: [{ icon: "car", days: "Daily", title: "Commute" }] },
      { time: "09:00 - 19:00", start: 540, end: 1140, duration: "10h",
        entries: [{ icon: "briefcase", days: "Daily", title: "Main Job" }] },
      { time: "19:00 - 20:30", start: 1140, end: 1230, duration: "1h 30m",
        entries: [{ icon: "car", days: "Daily", title: "Commute, Worst-Case Traffic" }] },
      { time: "20:30 - 21:00", start: 1230, end: 1260, duration: "30 min",
        entries: [
          { icon: "laptop", days: "MWF", title: "Second Job" },
          { icon: "rest", days: "TT", title: "Free Time / Relax" },
          { icon: "sparkle", days: "TTS", title: "Sanitization" } 
        ] },
      { time: "21:00 - 21:20", start: 1260, end: 1280, duration: "20 min",
        entries: [{ icon: "sparkle", days: "Daily", title: "Prayer" }] },
      { time: "21:20 - 21:30", start: 1280, end: 1290, duration: "10 min",
        entries: [
          { icon: "shower", days: "Mon", title: "Personal Care" },
          { icon: "rest", days: "Tue-Fri", title: "Free Time / Relax" }
        ] },
      { time: "21:30 - 22:00", start: 1290, end: 1320, duration: "30 min",
        entries: [{ icon: "dinner", days: "Daily", title: "Dinner" }] },
      { time: "22:00 - 22:15", start: 1320, end: 1335, duration: "15 min",
        entries: [
          { icon: "laptop", days: "MWF", title: "Finish Second Job If Needed" },
          { icon: "clipboard", days: "TT", title: "Prepare For Tomorrow" }
        ] },
      { time: "22:15 - 22:45", start: 1335, end: 1365, duration: "30 min",
        entries: [
          { icon: "moon", days: "MWF", title: "Wind Down, No Screens" },
          { icon: "moon", days: "TT", title: "Wind Down" }
        ] },
      { time: "22:45 - 06:00", start: 1365, end: 360, duration: "7h 15m",
        entries: [{ icon: "bed", days: "Daily", title: "Sleep", essential: true }] }
    ];

    const cardPalette = [
      "#5b8fd6", "#4fb0b5", "#6fb374", "#d8b84a", "#e08a4c",
      "#d25f5a", "#c66aa0", "#8b6fc9", "#4f6fae"
    ];

    const DAYS = [
      { key: "Mon", full: "Monday", jsDay: 1 },
      { key: "Tue", full: "Tuesday", jsDay: 2 },
      { key: "Wed", full: "Wednesday", jsDay: 3 },
      { key: "Thu", full: "Thursday", jsDay: 4 },
      { key: "Fri", full: "Friday", jsDay: 5 },
      { key: "Sat", full: "Saturday", jsDay: 6 },
      { key: "Sun", full: "Sunday", jsDay: 0 }
    ];

    const dayTabsEl = document.querySelector("#dayTabs");
    const scheduleEl = document.querySelector("#schedule");
    const liveTimeEl = document.querySelector("#liveTime");
    const todayLabelEl = document.querySelector("#todayLabel");
    const dayProgressEl = document.querySelector("#dayProgress");
    const dayProgressTrackEl = document.querySelector("#dayProgressTrack");
    const dayProgressTextEl = document.querySelector("#dayProgressText");
    const dayProgressTaskEl = document.querySelector("#dayProgressTask");

    // Simplified to ONLY apply color to day-tabs, leaving the body pure white.
    function applyActiveAccent(cardEl) {
      if (!cardEl) {
        document.body.style.removeProperty("--active-accent"); 
        return;
      }
      const accent = cardEl.style.getPropertyValue("--card-accent").trim();
      if (accent) {
        document.body.style.setProperty("--active-accent", accent);
      }
    }

    let lastCurrentTaskId = null;

    function todayJsDay() {
      return new Date().getDay();
    }

    function keyForJsDay(jsDay) {
      return DAYS.find(d => d.jsDay === jsDay).key;
    }

    let selectedDay = keyForJsDay(todayJsDay());

    function iconMarkup(name) {
      return `<span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24">${ICONS[name]}</svg></span>`;
    }

    function titleCase(str) {
      return str.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
    }

    function dayLabelFor(days, selected) {
      if (days === "Daily") return "Daily";
      if (days === "Tue-Fri") return "Tue - Fri";
      const match = DAYS.find(d => d.key === selected);
      return match ? match.full : selected;
    }

    function isWeekend(day) {
      return day === "Sat" || day === "Sun";
    }

    function matchesSelectedDay(entry, selected) {
      if (entry.days === selected) return true;
      if (entry.days === "Tue-Fri" && ["Tue", "Wed", "Thu", "Fri"].includes(selected)) return true;
      if (entry.days === "MWF" && ["Mon", "Wed", "Fri"].includes(selected)) return true;
      if (entry.days === "TT" && ["Tue", "Thu"].includes(selected)) return true;
      if (entry.days === "TTS" && ["Tue", "Thu", "Sat"].includes(selected)) return true;
      
      if (isWeekend(selected)) return entry.essential === true;
      if (entry.days === "Daily") return true;
      
      return false;
    }

    function renderTabs() {
      dayTabsEl.innerHTML = DAYS.map(d => {
        const isToday = d.key === keyForJsDay(todayJsDay());
        const isSelected = d.key === selectedDay;
        return `<button type="button" class="day-tab${isSelected ? " selected" : ""}${isToday ? " is-today" : ""}" data-day="${d.key}" aria-pressed="${isSelected}">${d.key}</button>`;
      }).join("");

      dayTabsEl.querySelectorAll(".day-tab").forEach(btn => {
        btn.addEventListener("click", () => {
          const clickedDay = btn.dataset.day;

          if (clickedDay === selectedDay) {
            window.scrollTo({ top: 0, behavior: "smooth" });
          } else {
            selectedDay = clickedDay;
            const isTodayTab = (selectedDay === keyForJsDay(todayJsDay()));
            
            renderTabs();
            renderSchedule();
            
            if (isTodayTab) {
              updateLiveState({ shouldScroll: true });
            } else {
              updateLiveState({ shouldScroll: false });
              window.scrollTo({ top: 0 }); 
            }
          }
        });
      });
    }

    function renderSchedule() {
      let paletteIndex = 0;
      const cardsHtml = schedule.map(block => {
        const visibleEntries = block.entries.filter(e => matchesSelectedDay(e, selectedDay));
        if (visibleEntries.length === 0) return "";

        const accent = cardPalette[paletteIndex % cardPalette.length];
        const nextAccent = cardPalette[(paletteIndex + 1) % cardPalette.length];
        const animationDelay = Math.min(paletteIndex * 28, 180);
        paletteIndex += 1;

        const style = [
          `--card-accent: ${accent}`,
          `--card-next: ${nextAccent}`,
          `--card-border: color-mix(in srgb, ${accent} 15%, transparent)`,
          `--card-in-delay: ${animationDelay}ms`
        ].join(";");

        const activitiesHtml = visibleEntries.map(entry => `
          <div class="activity">
            ${iconMarkup(entry.icon)}
            <span class="activity-title">${titleCase(entry.title)}</span>
          </div>
        `).join("");

        const dayLabelText = visibleEntries.length === 1
          ? dayLabelFor(visibleEntries[0].days, selectedDay)
          : "Daily";

        const logicEnd = block.end < block.start ? 1440 : block.end;

        return `
          <article class="card card-enter" style="${style}" data-start="${block.start}" data-end="${logicEnd}">
            <div class="card-row">
              <span class="day-label">${dayLabelText}</span>
              <span class="time">${block.time}</span>
              <span class="duration">${block.duration}</span>
            </div>
            <div class="divider" aria-hidden="true"></div>
            ${activitiesHtml}
          </article>
        `;
      }).join("");

      scheduleEl.innerHTML = cardsHtml || `<p class="empty-state">Nothing scheduled for this day.</p>`;

      const enteringCards = scheduleEl.querySelectorAll(".card-enter");
      
      setTimeout(() => {
        requestAnimationFrame(() => {
          enteringCards.forEach(card => card.classList.remove("card-enter"));
        });
      }, 150);
    }

    function minutesNow(date) {
      return date.getHours() * 60 + date.getMinutes();
    }

    function isWithinBlock(nowMin, start, end) {
      return end < start
        ? nowMin >= start || nowMin < end
        : nowMin >= start && nowMin < end;
    }

    function formatClock(date) {
      return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function scrollCardToCenter(card, delay = 0) {
      window.setTimeout(() => {
        const headerElForTint = document.querySelector("#header");
        const rect = card.getBoundingClientRect();
        const headerHeight = headerElForTint ? headerElForTint.getBoundingClientRect().height : 0;
        const visibleHeight = window.innerHeight - headerHeight;
        const targetTop = window.scrollY + rect.top - headerHeight - ((visibleHeight - rect.height) / 2);
        window.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });
      }, delay);
    }

    const WAKE_START = 360; 
    const SLEEP_START = 1365; 
    let progressSegments = null;

    function buildProgressSegments() {
      const segmentBlocks = schedule.slice(0, schedule.length - 1); 
      dayProgressTrackEl.innerHTML = "";
      return segmentBlocks.map((block, i) => {
        const duration = block.end - block.start;
        const color = cardPalette[i % cardPalette.length];
        const seg = document.createElement("div");
        seg.className = "day-progress-segment";
        seg.style.flex = `${duration} 0 0`;
        seg.style.setProperty("--seg-color", color);
        const fill = document.createElement("div");
        fill.className = "day-progress-segment-fill";
        seg.appendChild(fill);
        dayProgressTrackEl.appendChild(seg);
        return { start: block.start, end: block.end, fillEl: fill };
      });
    }

    function updateDayProgress(nowMin, currentTaskTitle) {
      const isViewingToday = selectedDay === keyForJsDay(todayJsDay());
      if (!isViewingToday || isWeekend(selectedDay)) {
        dayProgressEl.classList.add("hidden");
        return;
      }
      dayProgressEl.classList.remove("hidden");

      if (!progressSegments) {
        progressSegments = buildProgressSegments();
      }

      progressSegments.forEach(seg => {
        let segPercent;
        if (nowMin >= seg.end) segPercent = 100;
        else if (nowMin <= seg.start) segPercent = 0;
        else segPercent = ((nowMin - seg.start) / (seg.end - seg.start)) * 100;
        seg.fillEl.style.width = `${segPercent}%`;
      });

      const raw = (nowMin - WAKE_START) / (SLEEP_START - WAKE_START);
      const percent = Math.round(Math.min(1, Math.max(0, raw)) * 100);
      dayProgressTextEl.textContent = `${percent}%`;

      let taskLabel = currentTaskTitle;
      if (!taskLabel) {
        if (nowMin < WAKE_START) taskLabel = "Not started yet";
        else if (nowMin >= SLEEP_START) taskLabel = "Day complete";
        else taskLabel = "Between tasks";
      }
      dayProgressTaskEl.textContent = taskLabel;
    }

    function updateLiveState({ shouldScroll = false } = {}) {
      const now = new Date();
      const nowMin = minutesNow(now);
      const longDay = now.toLocaleDateString([], { weekday: "long" });
      const monthDay = now.toLocaleDateString([], { month: "short", day: "numeric" });

      liveTimeEl.textContent = formatClock(now);
      document.querySelector(".live-clock small").textContent = "Live";
      todayLabelEl.textContent = `${longDay}, ${monthDay}`;

      document.querySelectorAll(".now-badge").forEach(badge => badge.remove());

      const isViewingToday = selectedDay === keyForJsDay(todayJsDay());
      const cards = Array.from(document.querySelectorAll(".card"));
      const brightnessFloor = 0.8;
      const brightnessStep = 0.05;

      if (!isViewingToday) {
        const todayIndex = DAYS.findIndex(d => d.key === keyForJsDay(todayJsDay()));
        const selectedIndex = DAYS.findIndex(d => d.key === selectedDay);
        const isPreviousDay = selectedIndex < todayIndex;
        lastCurrentTaskId = null;

        cards.forEach(card => {
          card.classList.remove("current", "past");
          card.classList.toggle("previous-day", isPreviousDay);
          
          card.dataset.baseOpacity = isPreviousDay ? "0.5" : "1"; 
        });
        applyActiveAccent(null);
        updateDayProgress(nowMin, null);
        applyScrollFade();
        return;
      }

      const upcoming = [];
      let currentCard = null;

      cards.forEach(card => {
        const start = Number(card.dataset.start);
        const end = Number(card.dataset.end);
        const isCurrent = isWithinBlock(nowMin, start, end);

        card.classList.remove("current", "past", "previous-day");

        if (isCurrent) {
          currentCard = card;
          card.dataset.baseOpacity = "1";
        } else if (end <= start ? false : end <= nowMin) {
          card.classList.add("past");
          card.dataset.baseOpacity = "0.5";
        } else {
          const distance = start - nowMin;
          upcoming.push({ card, distance });
        }
      });

      upcoming.sort((a, b) => a.distance - b.distance);
      upcoming.forEach((item) => {
        item.card.dataset.baseOpacity = "1";
      });

      applyActiveAccent(currentCard || (upcoming[0] && upcoming[0].card) || null);

      let currentTaskTitle = null;
      if (currentCard) {
        const currentTaskId = `${currentCard.dataset.start}-${currentCard.dataset.end}`;
        const currentTaskChanged = currentTaskId !== lastCurrentTaskId;
        lastCurrentTaskId = currentTaskId;

        currentCard.classList.add("current");
        const badge = document.createElement("span");
        badge.className = "now-badge";
        badge.textContent = "Now";
        currentCard.appendChild(badge);
        if (shouldScroll || currentTaskChanged) {
          scrollCardToCenter(currentCard, shouldScroll ? 180 : 80);
        }
        const titleEl = currentCard.querySelector(".activity-title");
        currentTaskTitle = titleEl ? titleEl.textContent : null;
      } else {
        lastCurrentTaskId = null;
      }

      updateDayProgress(nowMin, currentTaskTitle);
      applyScrollFade();
    }

    function applyScrollFade() {
      const headerElForTint = document.querySelector("#header");
      if (!headerElForTint) return;
      const headerBottom = headerElForTint.getBoundingClientRect().bottom;
      const vanishPoint = headerBottom - 10; 
      const SCROLL_FADE_ZONE = 120; 
      const fadeStart = vanishPoint + SCROLL_FADE_ZONE;

      const cards = document.querySelectorAll(".card");
      
      const cardData = Array.from(cards).map(card => {
        const rect = card.getBoundingClientRect();
        return {
          element: card,
          cardTarget: rect.top + (rect.height * 0.8),
          baseOpacity: card.dataset.baseOpacity !== undefined ? parseFloat(card.dataset.baseOpacity) : 1
        };
      });

      cardData.forEach(data => {
        let scrollFactor;
        if (data.cardTarget >= fadeStart) {
          scrollFactor = 1;
        } else if (data.cardTarget <= vanishPoint) {
          scrollFactor = 0;
        } else {
          scrollFactor = (data.cardTarget - vanishPoint) / SCROLL_FADE_ZONE;
        }

        const finalOpacity = Math.max(0, Math.min(1, data.baseOpacity * scrollFactor));
        data.element.style.opacity = String(finalOpacity);
      });
    }

    let scrollFadeTicking = false;
    function requestScrollFade() {
      if (scrollFadeTicking) return;
      scrollFadeTicking = true;
      requestAnimationFrame(() => {
        applyScrollFade();
        scrollFadeTicking = false;
      });
    }

    window.addEventListener("scroll", requestScrollFade, { passive: true });
    window.addEventListener("resize", requestScrollFade);

    renderTabs();
    renderSchedule();
    updateLiveState({ shouldScroll: true });
    applyScrollFade();
    window.setInterval(() => updateLiveState(), 30000);

    const headerEl = document.querySelector("#header");
    
    function updateHeaderHeightCSS() {
      if (headerEl) {
        const h = headerEl.getBoundingClientRect().height;
        document.documentElement.style.setProperty('--header-height', `${h + 20}px`);
      }
    }

    window.addEventListener('resize', updateHeaderHeightCSS);
    updateHeaderHeightCSS();

    let isHeaderCompact = false;
    
    window.addEventListener("scroll", () => {
      if (!headerEl) return;
      
      const currentScroll = window.scrollY;
      
      if (!isHeaderCompact && currentScroll > 60) {
        isHeaderCompact = true;
        headerEl.classList.add("compact");
        
        setTimeout(() => {
          requestAnimationFrame(updateHeaderHeightCSS);
        }, 230);
      } 
      else if (isHeaderCompact && currentScroll < 10) {
        isHeaderCompact = false;
        headerEl.classList.remove("compact");
        
        setTimeout(() => {
          requestAnimationFrame(updateHeaderHeightCSS);
        }, 230);
      }
    }, { passive: true });

  </script>
</body>
</html>
